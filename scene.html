<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Аукцион призового барана</title>
<style>
  html, body { margin: 0; padding: 0; background: #140903; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; }
  svg { display: block; width: 100vw; height: auto; max-height: 100vh; }
</style>
</head>
<body>

<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Аукцион призового барана</title>
  <desc id="dsc">Гигантский баран с закрученными рогами на деревянном помосте посреди средневековой рыночной площади на закате; рядом кричит толстый купец, вокруг толпится народ.</desc>

  <!-- ============================================================
       DEFS: градиенты, фильтры, маски
       ============================================================ -->
  <defs>
    <!-- Небо заката: от тёмной умбры в зените к раскалённому золоту у горизонта -->
    <linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#1d0c04"/>
      <stop offset="0.22" stop-color="#5a220b"/>
      <stop offset="0.45" stop-color="#a9481a"/>
      <stop offset="0.66" stop-color="#dd8630"/>
      <stop offset="0.86" stop-color="#f3bd63"/>
      <stop offset="1"    stop-color="#c98436"/>
    </linearGradient>

    <!-- Солнечное гало прямо за головой барана (контровой свет) -->
    <radialGradient id="gSun" cx="1010" cy="300" r="440" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#fff6d2" stop-opacity="0.98"/>
      <stop offset="0.16" stop-color="#ffdc8e" stop-opacity="0.82"/>
      <stop offset="0.45" stop-color="#f2912f" stop-opacity="0.38"/>
      <stop offset="1"    stop-color="#e8761f" stop-opacity="0"/>
    </radialGradient>

    <!-- Дымка над площадью: пыль, поднятая толпой -->
    <linearGradient id="gHaze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc069" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffb457" stop-opacity="0.38"/>
    </linearGradient>

    <!-- Шерсть: подсвеченный верх, глубокая тень в брюхе -->
    <linearGradient id="gWool" x1="0.15" y1="0" x2="0.5" y2="1">
      <stop offset="0"    stop-color="#e8b05a"/>
      <stop offset="0.34" stop-color="#b87c30"/>
      <stop offset="0.72" stop-color="#7a4a1a"/>
      <stop offset="1"    stop-color="#43240c"/>
    </linearGradient>

    <!-- Рог: полированная кость, ловящая закат -->
    <linearGradient id="gHorn" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0"    stop-color="#ffe6a8"/>
      <stop offset="0.35" stop-color="#d0a154"/>
      <stop offset="0.72" stop-color="#8d6026"/>
      <stop offset="1"    stop-color="#4e3211"/>
    </linearGradient>

    <!-- Доски помоста -->
    <linearGradient id="gWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#8a5a2b"/>
      <stop offset="0.5"  stop-color="#5f3a19"/>
      <stop offset="1"    stop-color="#2e1a0a"/>
    </linearGradient>

    <!-- Кованая бирка на шее -->
    <linearGradient id="gIron" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0"   stop-color="#9aa0a6"/>
      <stop offset="0.5" stop-color="#5c6167"/>
      <stop offset="1"   stop-color="#2b2e31"/>
    </linearGradient>

    <!-- Виньетка: гасим углы, чтобы взгляд шёл к барану -->
    <radialGradient id="gVign" cx="0.56" cy="0.44" r="0.78">
      <stop offset="0"    stop-color="#000" stop-opacity="0"/>
      <stop offset="0.62" stop-color="#000" stop-opacity="0"/>
      <stop offset="1"    stop-color="#180a02" stop-opacity="0.72"/>
    </radialGradient>

    <!-- Мягкое размытие для лучей и дальнего плана -->
    <filter id="fBlurL" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="fBlurM" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="fBlurS" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <!-- "Кисть": лёгкое смещение контуров, чтобы края не были векторно-стерильными -->
    <filter id="fBrush" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="11" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="fBrushSoft" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <!-- Зерно холста поверх всей сцены -->
    <filter id="fGrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="11"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>

    <!-- Лучи и пыль живут только внутри кадра -->
    <clipPath id="clipFrame"><rect x="0" y="0" width="1600" height="900"/></clipPath>
  </defs>

  <g clip-path="url(#clipFrame)">

    <!-- ============================================================
         СЛОЙ 1 — НЕБО И СОЛНЦЕ
         ============================================================ -->
    <g id="layer-sky">
      <rect x="0" y="0" width="1600" height="900" fill="url(#gSky)"/>
      <rect x="0" y="0" width="1600" height="900" fill="url(#gSun)"/>
      <!-- Диск солнца, наполовину съеденный рогами -->
      <circle cx="1010" cy="300" r="86" fill="#fff4cd" opacity="0.85" filter="url(#fBlurM)"/>
      <!-- Рваные облачные мазки -->
      <g fill="#ffb055" opacity="0.3" filter="url(#fBlurM)">
        <path d="M120 214 C 300 178, 470 206, 610 188 C 470 232, 300 246, 120 214 Z"/>
        <path d="M1140 150 C 1300 122, 1470 148, 1580 132 C 1450 178, 1280 190, 1140 150 Z"/>
        <path d="M300 336 C 460 312, 600 332, 700 320 C 590 358, 430 366, 300 336 Z"/>
      </g>
      <!-- Объёмные лучи из-за барана (генерируются скриптом) -->
      <g id="godrays" opacity="0.5" filter="url(#fBlurL)"></g>
    </g>

    <!-- ============================================================
         СЛОЙ 2 — ДАЛЬНИЙ ПЛАН: холм и замок
         ============================================================ -->
    <g id="layer-far" opacity="0.55" filter="url(#fBlurS)">
      <!-- Холм -->
      <path d="M0 470 C 90 396, 210 358, 330 372 C 430 384, 500 418, 560 462 L 560 520 L 0 520 Z" fill="#7a3f1c"/>
      <!-- Силуэт замка на вершине -->
      <g fill="#5e2f14">
        <rect x="150" y="268" width="34" height="112"/>
        <rect x="196" y="296" width="86" height="84"/>
        <rect x="292" y="252" width="42" height="128"/>
        <rect x="130" y="318" width="18" height="62"/>
        <path d="M144 268 L 167 226 L 190 268 Z"/>
        <path d="M286 252 L 313 202 L 340 252 Z"/>
        <path d="M196 296 L 196 282 L 208 282 L 208 296 Z M 226 296 L 226 282 L 238 282 L 238 296 Z M 256 296 L 256 282 L 268 282 L 268 296 Z"/>
      </g>
      <!-- Окна, ловящие последний свет -->
      <g fill="#ffce7a" opacity="0.9">
        <rect x="162" y="300" width="8" height="14"/>
        <rect x="306" y="286" width="8" height="14"/>
        <rect x="228" y="330" width="9" height="16"/>
      </g>
    </g>

    <!-- ============================================================
         СЛОЙ 3 — ГОРОД: фахверковые дома по краям кадра
         ============================================================ -->
    <g id="layer-town" filter="url(#fBrushSoft)">

      <!-- Левый квартал -->
      <g fill="#40200d">
        <path d="M0 430 L 0 700 L 210 700 L 210 418 L 104 344 Z"/>
        <path d="M186 470 L 186 700 L 372 700 L 372 452 L 280 386 Z"/>
        <path d="M348 500 L 348 700 L 452 700 L 452 486 L 400 448 Z"/>
      </g>
      <!-- Кривые трубы -->
      <g fill="#341a0a">
        <path d="M62 372 l 30 -20 l 6 56 l -30 4 Z"/>
        <path d="M312 414 l 26 -16 l 4 48 l -26 4 Z"/>
      </g>
      <!-- Фахверк: балки на светлой штукатурке -->
      <g stroke="#2a1408" stroke-width="7" opacity="0.55">
        <path d="M18 480 h 176 M18 560 h 176 M70 480 v 80 M130 480 v 80 M18 480 l 52 80 M130 480 l 52 80"/>
        <path d="M200 520 h 156 M200 596 h 156 M254 520 v 76 M310 520 v 76 M200 520 l 54 76"/>
      </g>
      <g fill="#c98a4e" opacity="0.35">
        <rect x="18" y="480" width="176" height="80"/>
        <rect x="200" y="520" width="156" height="76"/>
      </g>
      <!-- Тёплые окна -->
      <g fill="#ffd689" opacity="0.92">
        <rect x="36" y="498" width="26" height="34" rx="3"/>
        <rect x="146" y="498" width="26" height="34" rx="3"/>
        <rect x="228" y="538" width="24" height="32" rx="3"/>
        <rect x="318" y="538" width="24" height="32" rx="3"/>
        <rect x="392" y="560" width="26" height="34" rx="3"/>
      </g>

      <!-- Правый квартал -->
      <g fill="#3a1c0b">
        <path d="M1600 400 L 1600 700 L 1400 700 L 1400 392 L 1502 314 Z"/>
        <path d="M1424 460 L 1424 700 L 1242 700 L 1242 444 L 1332 374 Z"/>
        <path d="M1264 502 L 1264 700 L 1168 700 L 1168 490 L 1216 452 Z"/>
      </g>
      <g fill="#2d1508">
        <path d="M1508 342 l 28 -18 l 6 52 l -28 4 Z"/>
        <path d="M1290 402 l 26 -16 l 4 46 l -26 4 Z"/>
      </g>
      <g stroke="#241105" stroke-width="7" opacity="0.55">
        <path d="M1416 456 h 172 M1416 536 h 172 M1470 456 v 80 M1530 456 v 80 M1416 456 l 54 80"/>
        <path d="M1258 510 h 152 M1258 588 h 152 M1310 510 v 78 M1364 510 v 78 M1364 510 l -54 78"/>
      </g>
      <g fill="#c2814a" opacity="0.32">
        <rect x="1416" y="456" width="172" height="80"/>
        <rect x="1258" y="510" width="152" height="78"/>
      </g>
      <g fill="#ffd07a" opacity="0.9">
        <rect x="1436" y="472" width="26" height="34" rx="3"/>
        <rect x="1544" y="472" width="26" height="34" rx="3"/>
        <rect x="1282" y="528" width="24" height="32" rx="3"/>
        <rect x="1372" y="528" width="24" height="32" rx="3"/>
      </g>

      <!-- Гирлянды флажков через площадь -->
      <g id="bunting"></g>

      <!-- Птицы, кружащие в закатном небе -->
      <g id="birds" stroke="#2a1206" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.72"></g>
    </g>

    <!-- ============================================================
         СЛОЙ 4 — РЕКВИЗИТ ПЛОЩАДИ: телеги, сено, бочки, бард
         ============================================================ -->
    <g id="layer-props" filter="url(#fBrushSoft)">

      <!-- Левая телега с сеном -->
      <g transform="translate(-56,596)">
        <path d="M8 60 L 214 60 L 232 96 L -10 96 Z" fill="#4a2a11"/>
        <!-- копна -->
        <path d="M14 60 C 26 6, 92 -18, 132 -6 C 176 6, 206 30, 216 60 Z" fill="#c08a37"/>
        <path d="M14 60 C 40 30, 100 12, 216 60 Z" fill="#e0aa50" opacity="0.55"/>
        <circle cx="42" cy="104" r="30" fill="#3a2009"/>
        <circle cx="42" cy="104" r="12" fill="#5c3616"/>
        <circle cx="184" cy="104" r="30" fill="#3a2009"/>
        <circle cx="184" cy="104" r="12" fill="#5c3616"/>
      </g>

      <!-- Правая телега с репой и капустой -->
      <g transform="translate(1300,556)">
        <path d="M0 54 L 180 54 L 196 90 L -14 90 Z" fill="#452710"/>
        <g fill="#8e5f2c">
          <ellipse cx="34" cy="46" rx="24" ry="18"/>
          <ellipse cx="86" cy="40" rx="26" ry="20"/>
          <ellipse cx="140" cy="46" rx="24" ry="18"/>
          <ellipse cx="60" cy="24" rx="22" ry="17"/>
          <ellipse cx="114" cy="24" rx="22" ry="17"/>
        </g>
        <g fill="#b3833f" opacity="0.6">
          <ellipse cx="60" cy="20" rx="12" ry="8"/>
          <ellipse cx="114" cy="20" rx="12" ry="8"/>
        </g>
        <circle cx="34" cy="98" r="28" fill="#331c08"/>
        <circle cx="152" cy="98" r="28" fill="#331c08"/>
      </g>

      <!-- Тюки сена штабелем -->
      <g transform="translate(1180,600)" fill="#a97b34">
        <rect x="0" y="34" width="74" height="46" rx="8"/>
        <rect x="78" y="34" width="74" height="46" rx="8"/>
        <rect x="38" y="-10" width="74" height="46" rx="8"/>
        <g stroke="#6d4c1a" stroke-width="3" opacity="0.7">
          <path d="M22 34 v 46 M52 34 v 46 M100 34 v 46 M130 34 v 46 M60 -10 v 46 M90 -10 v 46"/>
        </g>
      </g>

      <!-- Бард на бочке: играет, пока идут торги -->
      <g transform="translate(1462,506)">
        <!-- бочка -->
        <path d="M-30 96 C -40 70, -40 40, -30 14 L 30 14 C 40 40, 40 70, 30 96 Z" fill="#633c18"/>
        <g stroke="#3c2209" stroke-width="4" fill="none"><path d="M-36 40 h 72 M-38 66 h 76"/></g>
        <!-- фигура барда -->
        <g fill="#2a1408">
          <path d="M-14 14 L -18 -44 L 16 -44 L 12 14 Z"/>
          <circle cx="-2" cy="-58" r="15"/>
          <path d="M-17 -62 l 34 -10 l -4 12 Z"/>
          <path d="M-18 -40 C -34 -28, -38 -12, -32 -2 L -24 -8 C -28 -18, -24 -28, -12 -34 Z"/>
        </g>
        <!-- лютня -->
        <g fill="#8a5a24">
          <ellipse cx="16" cy="-20" rx="17" ry="21"/>
          <rect x="24" y="-58" width="8" height="38" rx="3" transform="rotate(18 28 -40)"/>
        </g>
      </g>
    </g>

    <!-- Дымка, отделяющая толпу от фона -->
    <rect x="0" y="380" width="1600" height="520" fill="url(#gHaze)" opacity="0.5"/>

    <!-- ============================================================
         СЛОЙ 5 — ЗАДНИЕ РЯДЫ ТОЛПЫ (мельче, светлее — глубина)
         ============================================================ -->
    <g id="crowd-back" opacity="0.85"></g>

    <!-- ============================================================
         СЛОЙ 6 — ПОМОСТ из дубовых досок
         ============================================================ -->
    <g id="layer-stage">
      <!-- верхняя плоскость в лёгкой перспективе -->
      <path d="M196 632 L 1252 632 L 1300 664 L 148 664 Z" fill="#7b4f24"/>
      <!-- передняя стенка -->
      <rect x="148" y="664" width="1152" height="82" fill="url(#gWood)"/>
      <!-- швы досок -->
      <g stroke="#261506" stroke-width="3" opacity="0.75" id="planks"></g>
      <!-- опорные балки -->
      <g fill="#2a1708">
        <rect x="176" y="746" width="46" height="54"/>
        <rect x="1218" y="746" width="46" height="54"/>
      </g>
      <!-- рассыпанное сено у копыт -->
      <g id="hay-stage" stroke="#e3ae52" stroke-width="3.5" stroke-linecap="round" opacity="0.85"></g>
      <!-- блик заката по переднему ребру помоста -->
      <path d="M148 664 L 1300 664" stroke="#ffcb7d" stroke-width="5" opacity="0.55"/>
    </g>

    <!-- ============================================================
         СЛОЙ 7 — БАРАН: центр композиции
         ============================================================ -->
    <g id="layer-ram" filter="url(#fBrush)">

      <!-- Длинная тень, брошенная закатом на доски -->
      <ellipse cx="628" cy="660" rx="300" ry="16" fill="#1c0d03" opacity="0.42"/>

      <!-- Дальний рог: уходит за череп, потому темнее и чуть меньше -->
      <path d="M1021.5 262.8 A118 118 0 1 0 1087.2 434 L1056 416 A82 82 0 1 1 1010.3 297 Z"
            fill="#6b4519" opacity="0.92"
            transform="translate(1060,360) scale(1.14) translate(-1060,-360) translate(34,-8) translate(985,375) scale(0.9) translate(-985,-375) translate(-40,-26)"/>

      <!-- Задние ноги: короткие сваи под тушей -->
      <g fill="#6b3f16">
        <path d="M508 524 h 62 c 10 44, 8 88, -2 122 h -60 c -10 -38, -12 -80, -0 -122 Z"/>
        <path d="M586 532 h 60 c 10 42, 8 84, -2 116 h -58 c -10 -36, -12 -76, -0 -116 Z"/>
      </g>

      <!-- Туша: бочка, поставленная на ножки -->
      <path d="M452 436
               C 438 352, 496 296, 590 278
               C 682 259, 796 268, 870 314
               C 924 348, 946 396, 936 450
               C 924 518, 862 566, 758 582
               C 640 600, 500 584, 468 528
               C 450 498, 448 466, 452 436 Z"
            fill="url(#gWool)"/>

      <!-- Хвост-помпон -->
      <path d="M456 418 C 424 404, 408 428, 418 452 C 428 476, 456 478, 466 460 Z" fill="#8a5a22"/>

      <!-- Передние ноги -->
      <g fill="#9a6224">
        <path d="M780 540 h 66 c 10 44, 8 86, -2 118 h -64 c -10 -38, -12 -78, -0 -118 Z"/>
        <path d="M862 532 h 62 c 10 44, 8 88, -2 122 h -60 c -10 -38, -12 -80, -0 -122 Z"/>
      </g>
      <!-- Контровой свет по передним бабкам -->
      <g stroke="#ffcf87" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.5">
        <path d="M844 556 c 8 34, 8 68, 2 96"/>
        <path d="M922 548 c 8 36, 8 72, 2 100"/>
      </g>
      <!-- Копыта -->
      <g fill="#241206">
        <path d="M506 640 h 66 l 6 26 h -78 Z"/>
        <path d="M584 642 h 62 l 6 24 h -74 Z"/>
        <path d="M778 638 h 70 l 6 28 h -82 Z"/>
        <path d="M860 636 h 66 l 6 30 h -78 Z"/>
      </g>

      <!-- Шея: столб мышц, спрятанный под руном -->
      <path d="M852 336 C 894 292, 950 270, 1010 278 C 1050 284, 1066 316, 1056 360
               C 1044 414, 976 448, 918 442 C 874 438, 850 398, 852 336 Z"
            fill="#a86c28"/>

      <!-- Курчавое руно: сотни завитков, генерируются скриптом -->
      <g id="wool"></g>

      <!-- Контровой свет по хребту -->
      <path d="M470 406 C 486 322, 574 280, 676 272 C 776 264, 856 296, 902 338"
            fill="none" stroke="#ffdc9a" stroke-width="6" stroke-linecap="round"
            opacity="0.45" filter="url(#fBlurS)"/>

      <!-- Голова и рог: единый блок, увеличенный и сдвинутый вправо,
           чтобы морда вышла из-за витка рога -->
      <g transform="translate(1060,360) scale(1.14) translate(-1060,-360) translate(34,-8)">

      <!-- Голова: тяжёлый римский профиль -->
      <path d="M992 284
               C 1046 262, 1112 282, 1146 326
               C 1172 360, 1188 392, 1180 414
               C 1170 440, 1136 452, 1100 446
               C 1050 438, 1000 408, 982 364
               C 968 330, 970 296, 992 284 Z"
            fill="#b87c30"/>
      <!-- Тень под скулой -->
      <path d="M982 364 C 1010 402, 1056 430, 1104 442 C 1058 454, 1006 434, 982 364 Z"
            fill="#6d4114" opacity="0.72"/>
      <!-- Светлая морда -->
      <path d="M1124 372 C 1156 384, 1180 402, 1180 416 C 1172 440, 1140 450, 1108 444
               C 1116 420, 1120 394, 1124 372 Z" fill="#cf9440" opacity="0.6"/>

      <!-- Ухо, прижатое рогом -->
      <path d="M986 384 C 954 394, 928 414, 920 436 C 946 442, 976 424, 998 404 Z" fill="#8a5a22"/>

      <!-- Глаз: полуприкрытый, наглый. Зрачок горизонтальный — как у настоящих баранов -->
      <g>
        <ellipse cx="1106" cy="344" rx="17" ry="12" fill="#f5c04a"/>
        <rect x="1093" y="340" width="26" height="9" rx="4" fill="#1d0e04"/>
        <path d="M1086 338 C 1098 326, 1122 326, 1130 340 C 1116 332, 1098 332, 1086 338 Z" fill="#7a4a18"/>
        <!-- тяжёлое веко, опущенное ровно наполовину -->
        <path d="M1086 339 C 1099 329, 1121 329, 1129 341 L 1129 332 C 1119 322, 1095 322, 1084 335 Z" fill="#5c3510"/>
        <circle cx="1098" cy="339" r="3.4" fill="#fff3cf" opacity="0.9"/>
      </g>
      <!-- Бровь: та самая надменная складка -->
      <path d="M1078 318 C 1096 306, 1124 306, 1140 318" fill="none" stroke="#6d4114"
            stroke-width="7" stroke-linecap="round" opacity="0.75"/>

      <!-- Ноздря и самодовольная линия рта -->
      <ellipse cx="1164" cy="398" rx="9" ry="6.5" fill="#3a1d08" transform="rotate(-26 1164 398)"/>
      <path d="M1130 430 C 1148 438, 1166 432, 1176 420" fill="none" stroke="#4a2609"
            stroke-width="5" stroke-linecap="round"/>

      <!-- Ближний рог: спираль толще человеческого бедра -->
      <path d="M1021.5 262.8 A118 118 0 1 0 1087.2 434 L1056 416 A82 82 0 1 1 1010.3 297 Z"
            fill="url(#gHorn)"/>
      <!-- Кольцевые борозды (генерируются скриптом) -->
      <g id="horn-ridges" stroke="#5e3d13" stroke-width="4" stroke-linecap="round" opacity="0.42"></g>
      <!-- Закат по верхней кромке рога -->
      <path d="M1021.5 262.8 A118 118 0 0 0 867 375" fill="none" stroke="#fff0bd" stroke-width="6"

<script>
(function () {
  "use strict";

  var NS = "http://www.w3.org/2000/svg";

  /* Детерминированный псевдослучайный генератор (LCG):
     сцена должна выглядеть одинаково при каждой перезагрузке. */
  var seed = 20260910;
  function rnd() {
    seed = (seed * 1664525 + 1013904223) % 4294967296;
    return seed / 4294967296;
  }
  function between(a, b) { return a + rnd() * (b - a); }
  function pick(arr) { return arr[Math.floor(rnd() * arr.length)]; }

  /* Хелпер: создать SVG-элемент с атрибутами и вложить в родителя */
  function add(parent, tag, attrs) {
    var node = document.createElementNS(NS, tag);
    for (var key in attrs) node.setAttribute(key, attrs[key]);
    parent.appendChild(node);
    return node;
  }
  function byId(id) { return document.getElementById(id); }

  /* ---------- Объёмные лучи из-за головы барана ---------- */
  (function godrays() {
    var g = byId("godrays");
    var sx = 1010, sy = 300;
    for (var i = 0; i < 16; i++) {
      var a = between(0.15, Math.PI - 0.15);      /* веером вниз */
      var w = between(0.012, 0.05);
      var len = between(900, 1500);
      var p = [
        sx + Math.cos(a - w) * len, sy + Math.sin(a - w) * len,
        sx + Math.cos(a + w) * len, sy + Math.sin(a + w) * len
      ];
      add(g, "path", {
        d: "M" + sx + " " + sy + " L" + p[0].toFixed(1) + " " + p[1].toFixed(1) +
           " L" + p[2].toFixed(1) + " " + p[3].toFixed(1) + " Z",
        fill: "#ffdf9c",
        opacity: between(0.08, 0.26).toFixed(3)
      });
    }
  })();

  /* ---------- Гирлянды флажков ---------- */
  (function bunting() {
    var g = byId("bunting");
    var lines = [
      { x1: 96,   y1: 352, x2: 690,  y2: 268, sag: 74 },
      { x1: 760,  y1: 250, x2: 1512, y2: 322, sag: 88 },
      { x1: 300,  y1: 412, x2: 880,  y2: 372, sag: 60 }
    ];
    var colors = ["#c2352f", "#2f6e8c", "#d9a127", "#5d3a7a", "#2f7a4a"];

    lines.forEach(function (L) {
      var cx = (L.x1 + L.x2) / 2, cy = (L.y1 + L.y2) / 2 + L.sag * 2;
      add(g, "path", {
        d: "M" + L.x1 + " " + L.y1 + " Q" + cx + " " + cy + " " + L.x2 + " " + L.y2,
        fill: "none", stroke: "#2a1509", "stroke-width": 3, opacity: 0.8
      });
      /* флажки развешиваем по квадратичной кривой */
      var n = Math.round(Math.hypot(L.x2 - L.x1, L.y2 - L.y1) / 46);
      for (var i = 1; i < n; i++) {
        var t = i / n, mt = 1 - t;
        var x = mt * mt * L.x1 + 2 * mt * t * cx + t * t * L.x2;
        var y = mt * mt * L.y1 + 2 * mt * t * cy + t * t * L.y2;
        var w = between(15, 21), h = between(30, 44);
        add(g, "path", {
          d: "M" + (x - w) + " " + y + " L" + (x + w) + " " + y + " L" + x + " " + (y + h) + " Z",
          fill: pick(colors), opacity: between(0.75, 0.95).toFixed(2)
        });
      }
    });
  })();

  /* ---------- Птицы ---------- */
  (function birds() {
    var g = byId("birds");
    for (var i = 0; i < 11; i++) {
      var x = between(120, 1500), y = between(90, 300), s = between(0.5, 1.3);
      add(g, "path", {
        d: "M" + x + " " + y +
           " q" + (7 * s) + " " + (-7 * s) + " " + (14 * s) + " 0" +
           " q" + (7 * s) + " " + (-7 * s) + " " + (14 * s) + " 0",
        opacity: between(0.4, 0.85).toFixed(2)
      });
    }
  })();

  /* ---------- Швы досок помоста ---------- */
  (function planks() {
    var g = byId("planks");
    for (var x = 196; x < 1300; x += 62) {
      add(g, "path", { d: "M" + x + " 664 L" + (x + 14) + " 746" });
    }
    add(g, "path", { d: "M148 700 h 1152", opacity: 0.4 });
    /* потёртости на верхней плоскости */
    for (var i = 0; i < 26; i++) {
      var px = between(170, 1280), py = between(636, 660);
      add(g, "path", {
        d: "M" + px + " " + py + " l " + between(20, 70).toFixed(0) + " 0",
        "stroke-width": between(1, 2.6).toFixed(1), opacity: 0.3
      });
    }
  })();

  /* ---------- Сено у копыт ---------- */
  (function hay() {
    var g = byId("hay-stage");
    for (var i = 0; i < 90; i++) {
      var x = between(170, 1280), y = between(626, 662), a = between(0, Math.PI);
      var len = between(9, 26);
      add(g, "path", {
        d: "M" + x.toFixed(1) + " " + y.toFixed(1) +
           " l" + (Math.cos(a) * len).toFixed(1) + " " + (Math.sin(a) * len * 0.35).toFixed(1),
        opacity: between(0.35, 0.9).toFixed(2)
      });
    }
  })();

  /* ---------- Руно: сотни завитков поверх туши ----------
     Тон завитка зависит от высоты: макушка ловит закат, брюхо тонет в тени. */
  (function wool() {
    var g = byId("wool");

    /* Овалы, приблизительно описывающие тушу и шею */
    var blobs = [
      { cx: 690, cy: 424, rx: 238, ry: 146, n: 310 },
      { cx: 930, cy: 336, rx: 90,  ry: 76,  n: 72  },
      { cx: 516, cy: 464, rx: 94,  ry: 90,  n: 62  }
    ];

    blobs.forEach(function (b) {
      for (var i = 0; i < b.n; i++) {
        /* равномерная выборка внутри эллипса */
        var t = rnd() * Math.PI * 2;
        var r = Math.sqrt(rnd());
        var x = b.cx + Math.cos(t) * r * b.rx;
        var y = b.cy + Math.sin(t) * r * b.ry;

        /* 0 — верх туши, 1 — низ */
        var depth = (y - (b.cy - b.ry)) / (2 * b.ry);
        var fill;
        if (depth < 0.2)      fill = "#f0c069";
        else if (depth < 0.4) fill = "#cf9440";
        else if (depth < 0.62) fill = "#a86c25";
        else if (depth < 0.82) fill = "#7c4a16";
        else                   fill = "#4e2c0d";

        var rad = between(9, 20) * (1 - depth * 0.25);
        var curl = add(g, "path", {
          d: "M" + (x - rad) + " " + y +
             " a" + rad + " " + rad + " 0 1 1 " + (rad * 1.6) + " " + (-rad * 0.5) +
             " a" + (rad * 0.62) + " " + (rad * 0.62) + " 0 1 0 " + (-rad * 0.7) + " " + (rad * 0.7) + " Z",
          fill: fill,
          opacity: between(0.55, 0.95).toFixed(2)
        });
        curl.setAttribute("transform", "rotate(" + between(-40, 40).toFixed(0) + " " + x.toFixed(0) + " " + y.toFixed(0) + ")");
      }
    });

    /* Отдельный проход бликов по хребту — контровой свет цепляется за кончики шерсти */
    for (var k = 0; k < 90; k++) {
      var hx = between(470, 900);
      var hy = 282 + Math.pow((hx - 470) / 430, 2) * 46 + between(-14, 26);
      add(g, "circle", {
        cx: hx.toFixed(1), cy: hy.toFixed(1), r: between(2, 5.5).toFixed(1),
        fill: "#ffe3a6", opacity: between(0.15, 0.5).toFixed(2)
      });
    }
  })();

  /* ---------- Борозды на роге ---------- */
  (function hornRidges() {
    var g = byId("horn-ridges");
    var cx = 985, cy = 375, ro = 116, ri = 84;
    for (var a = -66; a < 26; a += 12) {
      var rad = a * Math.PI / 180;
      var jitter = between(-3, 3);
      add(g, "path", {
        d: "M" + (cx + Math.cos(rad) * (ro + jitter)).toFixed(1) + " " + (cy + Math.sin(rad) * (ro + jitter)).toFixed(1) +
           " L" + (cx + Math.cos(rad) * ri).toFixed(1) + " " + (cy + Math.sin(rad) * ri).toFixed(1),
        "stroke-width": between(3, 6).toFixed(1)
      });
    }
    for (var b = 26; b < 290; b += 12) {
      var rad2 = b * Math.PI / 180;
      add(g, "path", {
        d: "M" + (cx + Math.cos(rad2) * ro).toFixed(1) + " " + (cy + Math.sin(rad2) * ro).toFixed(1) +
           " L" + (cx + Math.cos(rad2) * ri).toFixed(1) + " " + (cy + Math.sin(rad2) * ri).toFixed(1),
        "stroke-width": between(3, 6).toFixed(1)
      });
    }
  })();

  /* ---------- Толпа ----------
     Три полосы по глубине: дальняя мельче и светлее, ближняя крупнее и чернее. */
  function crowd(target, opts) {
    var g = byId(target);
    var HATS = ["hood", "cone", "helm", "flat", "bare", "bare"];

    for (var i = 0; i < opts.count; i++) {
      var x = between(-30, 1630);
      var base = opts.base + between(-opts.jitter, opts.jitter);
      var h = opts.height * between(0.86, 1.16);
      var w = h * between(0.3, 0.4);
      var body = add(g, "g", { fill: opts.color, opacity: between(opts.alpha[0], opts.alpha[1]).toFixed(2) });

      /* торс и плечи */
      add(body, "path", {
        d: "M" + (x - w / 2) + " " + base +
           " C" + (x - w / 2 - 4) + " " + (base - h * 0.55) +
           " " + (x - w * 0.42) + " " + (base - h * 0.72) +
           " " + x + " " + (base - h * 0.74) +
           " C" + (x + w * 0.42) + " " + (base - h * 0.72) +
           " " + (x + w / 2 + 4) + " " + (base - h * 0.55) +
           " " + (x + w / 2) + " " + base + " Z"
      });
      /* голова */
      var hy = base - h * 0.85;
      add(body, "circle", { cx: x.toFixed(1), cy: hy.toFixed(1), r: (h * 0.115).toFixed(1) });

      /* головной убор */
      var hat = pick(HATS), hr = h * 0.115;
      if (hat === "hood") {
        add(body, "path", { d: "M" + (x - hr * 1.5) + " " + (hy + hr * 0.6) +
          " C" + (x - hr * 1.7) + " " + (hy - hr * 1.5) + " " + (x + hr * 1.7) + " " + (hy - hr * 1.5) +
          " " + (x + hr * 1.5) + " " + (hy + hr * 0.6) + " Z" });
      } else if (hat === "cone") {
        add(body, "path", { d: "M" + (x - hr * 1.5) + " " + (hy - hr * 0.5) +
          " L" + (x + hr * 0.4) + " " + (hy - hr * 3.4) + " L" + (x + hr * 1.5) + " " + (hy - hr * 0.5) + " Z" });
      } else if (hat === "helm") {
        add(body, "path", { d: "M" + (x - hr * 1.25) + " " + (hy + hr * 0.2) +
          " a" + (hr * 1.25) + " " + (hr * 1.45) + " 0 0 1 " + (hr * 2.5) + " 0 Z" });
        add(body, "rect", { x: (x - hr * 1.3).toFixed(1), y: (hy + hr * 0.1).toFixed(1),
          width: (hr * 2.6).toFixed(1), height: (hr * 0.42).toFixed(1) });
      } else if (hat === "flat") {
        add(body, "ellipse", { cx: x.toFixed(1), cy: (hy - hr * 0.9).toFixed(1),
          rx: (hr * 2).toFixed(1), ry: (hr * 0.55).toFixed(1) });
      }

      /* руки: кто с табличкой, кто с кошелём, кто с пикой */
      var prop = rnd();
      if (prop < 0.3) {
        /* поднятая табличка для торгов */
        var ax = x + w * 0.5, ay = base - h * 0.66;
        add(body, "path", { d: "M" + ax + " " + ay + " L" + (ax + w * 0.34) + " " + (ay - h * 0.42),
          stroke: opts.color, "stroke-width": (h * 0.075).toFixed(1), fill: "none", "stroke-linecap": "round" });
        add(body, "rect", { x: (ax + w * 0.16).toFixed(1), y: (ay - h * 0.66).toFixed(1),
          width: (w * 0.44).toFixed(1), height: (h * 0.26).toFixed(1), rx: 3 });
      } else if (prop < 0.55) {
        /* потрясает кошелём */
        var bx = x - w * 0.5, by = base - h * 0.66;
        add(body, "path", { d: "M" + bx + " " + by + " L" + (bx - w * 0.3) + " " + (by - h * 0.36),
          stroke: opts.color, "stroke-width": (h * 0.075).toFixed(1), fill: "none", "stroke-linecap": "round" });
        add(body, "ellipse", { cx: (bx - w * 0.34).toFixed(1), cy: (by - h * 0.44).toFixed(1),
          rx: (w * 0.2).toFixed(1), ry: (w * 0.24).toFixed(1) });
      } else if (prop < 0.68) {
        /* рыцарь с пикой */
        add(body, "path", { d: "M" + (x + w * 0.42) + " " + base + " L" + (x + w * 0.42 - h * 0.12) + " " + (base - h * 1.45),
          stroke: opts.color, "stroke-width": (h * 0.035).toFixed(1), fill: "none" });
      } else if (prop < 0.8) {
        /* обе руки вверх */
        add(body, "path", { d: "M" + (x - w * 0.44) + " " + (base - h * 0.62) + " L" + (x - w * 0.62) + " " + (base - h * 1.0),
          stroke: opts.color, "stroke-width": (h * 0.07).toFixed(1), fill: "none", "stroke-linecap": "round" });
        add(body, "path", { d: "M" + (x + w * 0.44) + " " + (base - h * 0.62) + " L" + (x + w * 0.66) + " " + (base - h * 0.98),
          stroke: opts.color, "stroke-width": (h * 0.07).toFixed(1), fill: "none", "stroke-linecap": "round" });
      }

      /* закатный ободок по левому плечу — толпа тоже подсвечена сзади */
      if (rnd() < 0.62) {
        add(g, "path", {
          d: "M" + (x + w * 0.44) + " " + (base - h * 0.1) + " C" + (x + w * 0.52) + " " + (base - h * 0.55) +
             " " + (x + w * 0.3) + " " + (base - h * 0.74) + " " + x + " " + (base - h * 0.76),
          fill: "none", stroke: "#ffbe63", "stroke-width": (h * 0.035).toFixed(1),
          opacity: between(0.2, 0.5).toFixed(2), "stroke-linecap": "round"
        });
      }
    }
  }

  crowd("crowd-back",  { count: 44, base: 770, jitter: 12, height: 104, color: "#4a2410", alpha: [0.5, 0.75] });
  crowd("crowd-mid",   { count: 38, base: 872, jitter: 18, height: 156, color: "#2c1508", alpha: [0.78, 0.94] });
  crowd("crowd-front", { count: 18, base: 986, jitter: 20, height: 232, color: "#1d0c04", alpha: [0.88, 0.98] });

  /* ---------- Куры под ногами ---------- */
  (function chickens() {
    var g = byId("chickens");
    var spots = [[330, 654], [1178, 650], [980, 648], [470, 880]];
    spots.forEach(function (s) {
      var k = s[1] > 800 ? 1.8 : 1;
      var c = add(g, "g", { transform: "translate(" + s[0] + "," + s[1] + ") scale(" + k + ")" });
      add(c, "ellipse", { cx: 0, cy: 0, rx: 15, ry: 11, fill: "#e8d6b0" });
      add(c, "circle", { cx: 13, cy: -10, r: 6.5, fill: "#e8d6b0" });
      add(c, "path", { d: "M19 -11 l 8 3 l -8 3 Z", fill: "#d4892c" });
      add(c, "path", { d: "M11 -16 q 4 -6 7 0 q 3 -5 5 1 Z", fill: "#b3312c" });
      add(c, "path", { d: "M-15 -2 q -10 -6 -14 2 q 8 4 14 2 Z", fill: "#cbb489" });
      var legs = add(c, "g", { stroke: "#d4892c", "stroke-width": 3, "stroke-linecap": "round" });
      add(legs, "path", { d: "M-4 10 l -3 8" });
      add(legs, "path", { d: "M5 10 l 3 8" });
    });
  })();

  /* ---------- Пыль и сенная труха в воздухе ----------
     Гуще у солнца — там, где свет их проявляет. */
  (function motes() {
    var g = byId("motes");
    for (var i = 0; i < 260; i++) {
      var x = between(0, 1600), y = between(120, 880);
      var d = Math.hypot(x - 1010, y - 320) / 900;          /* близость к солнцу */
      var op = Math.max(0.05, (0.75 - d * 0.62)) * between(0.4, 1.2);
      add(g, "circle", {
        cx: x.toFixed(1), cy: y.toFixed(1),
        r: between(1, 4.2).toFixed(1),
        fill: "#ffe9b8", opacity: Math.min(op, 0.9).toFixed(3)
      });
    }
    /* соломинки покрупнее, кружащие в луче */
    for (var k = 0; k < 34; k++) {
      var hx = between(320, 1400), hy = between(240, 760), a = between(0, 180);
      add(g, "rect", {
        x: hx.toFixed(1), y: hy.toFixed(1),
        width: between(7, 18).toFixed(1), height: between(1.5, 3).toFixed(1),
        fill: "#ffd88a", opacity: between(0.25, 0.7).toFixed(2),
        transform: "rotate(" + a.toFixed(0) + " " + hx.toFixed(1) + " " + hy.toFixed(1) + ")"
      });
    }
  })();
})();
</script>
